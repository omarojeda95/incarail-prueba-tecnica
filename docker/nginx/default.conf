# Resolve "app" through Docker's DNS on every request (not only at startup),
# so recreating the API container never leaves nginx pointing to an old IP.
resolver 127.0.0.11 valid=10s ipv6=off;

# API: every request goes to Laravel's front controller in the PHP-FPM container.
server {
    listen 80;
    server_name _;

    client_max_body_size 8m;
    set $php_upstream app:9000;

    location / {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 60s;
    }
}

# SPA: static Vue build, with /api proxied to the API (same origin, no CORS).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
