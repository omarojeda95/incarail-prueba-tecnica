name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: incarail_test
          POSTGRES_USER: incarail
          POSTGRES_PASSWORD: incarail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incarail" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'pgsql' && 'incarail_test' || ':memory:' }}
      DB_USERNAME: incarail
      DB_PASSWORD: incarail
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pdo_sqlite, intl, bcmath
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test

      - name: Unit, integration and acceptance tests
        run: php artisan test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run ci:lint
      - run: npm run ci:format
      - run: npm run type-check
      - run: npm test
      - run: npm run build-only

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: docker compose build
